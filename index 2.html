<!doctype html>
<html lang="es">
<head>

<title>Pura Vida</title>

<meta property="og:description" content="Productos importados ubicados en San Juan de los Morros, con pickup, delivery local y envíos nacionales a todo el país. 🛵📦">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda de color con el nombre de la tienda, barra pegajosa de búsqueda y categorías, cuadrícula de tarjetas. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#14201D; --muted:#5B6A66; --line:#DCE3E0; --chip:#E6ECEA;
  --accent:#0A7D6B; --accent-ink:#FFFFFF; --accent-text:var(--accent);
  --danger:#C0352B; --imgbg:#FFFFFF;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 8px 22px -10px rgba(20,32,29,.22);
  --cardmin:156px;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#17211E; --ink:#EAF0EE; --muted:#9BABA6; --line:#2A3834; --chip:#22302C;
    --accent-text:color-mix(in srgb,var(--accent) 55%,#fff);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --ink:#EAF0EE; --muted:#9BABA6; --line:#2A3834; --chip:#22302C;
  --accent-text:color-mix(in srgb,var(--accent) 55%,#fff);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
html[data-font="suave"]{--f-display:'Poppins',system-ui,sans-serif;--f-body:'Poppins',system-ui,sans-serif}
html[data-font="elegante"]{--f-display:'Fraunces',Georgia,serif;--f-body:'Inter',system-ui,sans-serif}
html[data-density="compact"]{--cardmin:128px}
html[data-density="large"]{--cardmin:230px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body.lock{overflow:hidden}
html[data-edit="1"] body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,#fff);outline-offset:2px}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
.head{background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top,0px)}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 24px}
.head-text{min-width:0}
.brandrow{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
#logo{height:var(--logoh,64px);width:auto;max-width:100%;object-fit:contain;display:block;flex:none;cursor:default}
.logoprev{flex:none;width:84px;height:84px;border-radius:12px;border:1px dashed var(--line);background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;color:var(--muted);text-align:center;padding:4px}
.logoprev img{max-width:100%;max-height:100%;object-fit:contain}
.colorrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.colorrow span{font-size:15px}
#brand{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
#tagline{margin:8px 0 0;font-size:clamp(14px,2.2vw,17px);opacity:.88;max-width:60ch}
[contenteditable="true"]{outline:2px dashed color-mix(in srgb,currentColor 55%,transparent);outline-offset:6px;border-radius:6px;cursor:text}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost-on-accent{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);flex:none}
.btn.ghost-on-accent:hover{background:color-mix(in srgb,var(--accent-ink) 26%,transparent)}
.btn svg{width:16px;height:16px;flex:none}

/* Barra de herramientas */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .wrap{display:grid;gap:10px;padding-block:12px}
.row{display:flex;gap:10px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;padding:0 14px 0 42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.search input::placeholder{color:var(--muted)}
select.sort{height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:14px;max-width:46%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:var(--chip);font-size:14px;font-weight:500;white-space:nowrap}
.chip small{opacity:.65;margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Cuadrícula */
main{padding-block:20px 40px}
#count{margin:0 0 14px;color:var(--muted);font-size:14px}
.note{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:13.5px;color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cardmin)),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card.is-hidden{opacity:.55}
.thumb{position:relative;aspect-ratio:1;background:var(--imgbg);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.ph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.noimg img{display:none}
.noimg .ph{display:flex}
.badge{position:absolute;top:10px;left:10px;z-index:2;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;max-width:calc(100% - 56px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.off{background:#444;color:#fff}
.card .body{display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px;flex:1;min-width:0}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .desc{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
html[data-density="large"] .card .desc{-webkit-line-clamp:3;font-size:13.5px}
html[data-density="large"] .card h3{font-size:17px}
.price{margin-top:auto;padding-top:4px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.pen{position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pen svg{width:16px;height:16px}
.pen.eye{right:48px}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:6px}

footer{border-top:1px solid var(--line);padding-block:24px 36px;color:var(--muted);font-size:13.5px}
footer p{margin:0 0 4px}

/* Barra de edición */
#toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(0,0,0,.3);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;justify-content:center}
#toolbar .lbl{font-weight:600;font-size:13px;color:var(--muted);margin-right:6px}
#toolbar .btn{flex:0 1 auto;padding:0 14px}
@media (max-width:560px){#toolbar .lbl{display:none}#toolbar .btn{flex:1;padding:0 8px;font-size:13px}}

/* Ventanas */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,12,.55)}
.panel{position:relative;width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
@media (min-width:700px){#modal{align-items:center}.panel{border-radius:22px;max-height:90dvh}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.card{transition:none}}
.x{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.d-img{position:relative;background:var(--imgbg);height:min(52vh,340px);display:flex;align-items:center;justify-content:center;border-radius:22px 22px 0 0}
.d-img img{max-height:100%;max-width:100%;object-fit:contain;padding:16px}
.d-body{padding:20px 22px 26px;display:grid;gap:8px}
.d-cat{margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.d-body h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.d-price{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.d-desc{margin:0;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.d-body .btn{margin-top:8px;min-height:46px}
a.btn{text-decoration:none}

.form{padding:22px;display:grid;gap:14px}
.form h2{margin:0 40px 2px 0;font-family:var(--f-display);font-size:22px}
.form h3{margin:10px 0 0;font-family:var(--f-display);font-size:16px}
.field{display:grid;gap:6px;min-width:0}
.field>span,.lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=tel],.field textarea,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.imgrow{display:flex;gap:12px;align-items:center}
.imgprev{flex:none;width:84px;height:84px;border-radius:12px;border:1px solid var(--line);background:var(--imgbg);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgprev img{width:100%;height:100%;object-fit:contain;padding:4px}
.imgprev .ph{font-size:30px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{min-height:44px}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);padding-top:12px;margin-top:4px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sticky-actions .btn{flex:1;min-height:46px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.hint{margin:0;font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,460px);padding:11px 18px;border-radius:12px;background:#14201D;color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
html[data-edit="1"] #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* Computadora */
@media (min-width:900px){
  body{font-size:16px}
  .wrap{max-width:1240px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .head-in{padding-block:44px 38px}
  .brandrow{gap:22px}
  #brand{font-size:clamp(40px,4.4vw,60px)}
  #tagline{font-size:18px;max-width:70ch;margin-top:12px}
  .tools .wrap{grid-template-columns:1fr;gap:12px}
  .chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
  :root{--cardmin:215px}
  html[data-density="compact"]{--cardmin:165px}
  html[data-density="large"]{--cardmin:290px}
  #grid{gap:20px}
  .card .body{padding:14px 16px 16px}
  .card h3{font-size:16px}
  .card .desc{font-size:13.5px}
  .price{font-size:20px}
  main{padding-block:28px 56px}
  .panel:has(.d-img){max-width:900px;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;overflow:hidden;max-height:86dvh}
  .panel:has(.d-img) .d-img{height:auto;min-height:440px;border-radius:22px 0 0 22px}
  .panel:has(.d-img) .d-body{padding:36px 32px;align-content:start;overflow-y:auto}
  .d-body h2{font-size:28px}
}
@media (min-width:1500px){
  .wrap{max-width:1400px}
}
</style>
</head>
<body>
<header class="head">
  <div class="wrap head-in">
    <div class="head-text">
      <div class="brandrow"><img id="logo" alt="Logo de la tienda" hidden><h1 id="brand"></h1></div>
      <p id="tagline"></p>
    </div>
    <button class="btn ghost-on-accent" id="btnEdit" type="button"></button>
  </div>
</header>

<div class="tools">
  <div class="wrap">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar productos" autocomplete="off" aria-label="Buscar productos">
      </label>
      <select id="sort" class="sort" aria-label="Ordenar">
        <option value="orig">Orden original</option>
        <option value="name">Nombre A–Z</option>
        <option value="asc">Precio: menor a mayor</option>
        <option value="desc">Precio: mayor a menor</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  </div>
</div>

<main class="wrap">
  <div id="note"></div>
  <p id="count" aria-live="polite"></p>
  <div id="grid"></div>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div id="toolbar" hidden></div>
<div id="modal" hidden></div>

liever","desc":"El Acetaminofén 500 Mg de Equate es un analgésico eficaz diseñado para aliviar el dolor y reducir la fiebre. Con un formato de 100 tabletas, este producto es ideal para tener siempre a mano en el hogar, ofreciendo una solución rápida y confiable para diversas molestias.\n\nCada tableta contiene 500 mg de acetaminofén, lo que lo convierte en una opción potente para combatir dolores de cabeza, musculares, articulares y otros tipos de malestar. Su presentación en un paquete compacto de 20 cm de altura, 17 cm de ancho y 4 cm de largo facilita su almacenamiento y transporte.","price":8,"img":"https://http2.mlstatic.com/D_NQ_NP_2X_604984-MLV118980342521_102026-F.webp","cat":"Salud y farmacia","hidden":false,"tag":""},{"id":"nmwl2u0c4","name":"Vitamina D3 - Continuum","desc":"Detalles del producto: Marca: Continuum.  Tipo: Suplemento dietético en cápsulas blandas (Dietary Supplement).  Componente principal: Vitamina D3 (Vitamin D3).  Función principal: Formulado para apoyar la salud del sistema inmunológico y mantener huesos fuertes (Supports Immune Health & Strong Bones).  Presentación: Envase con 36 cápsulas blandas (36 Softgels).","price":0,"img":"https://imgproxy.treinta.co/sig/size:640:::/quality:90/plain/https%3A%2F%2Fcdn.treinta.co%2Fai-images%2F9f11fff9-ad85-5380-87c1-ea87b1003902_6a97869fb49b9698c75ac29bcdedec275df6e7d52350a7b63acb9b07a86792ae.jpeg","cat":"Suplementos","hidden":true,"tag":""},{"id":"nmwl2tb61","name":"Ibuprofeno Kirkland 500 Tabletas. Similar A Advil. Importado","desc":"Ibuprofeno KIRKLAND ofrece una solución eficaz para el alivio del dolor y la inflamación. Con 500 tabletas en cada paquete, este suplemento es ideal para quienes buscan un producto confiable y de calidad similar a Advil. Su formulación está diseñada para proporcionar un alivio rápido y duradero, permitiendo que continúes con tus actividades diarias sin interrupciones.\n\nEste ibuprofeno es perfecto para el manejo de dolores de cabeza, musculares, articulares y fiebr <script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var DEFAULTS={brand:'Mi Tienda',tagline:'Catálogo de productos',accent:'#0A7D6B',font:'moderna',density:'normal',theme:'auto',showDesc:true,currency:'$',whatsapp:'',footer:'Precios sujetos a cambio sin previo aviso.',bg:'',surface:'',ink:'',logo:'',logoSize:'medium',showName:true};
var BASE={bg:'#F3F6F5',surface:'#FFFFFF',ink:'#14201D'};
var SEED=JSON.parse($('#seed').textContent);
var LS='catalogo-tienda:'+(SEED.id||'v1');

function load(){
  try{
    var raw=localStorage.getItem(LS);
    if(raw){var p=JSON.parse(raw); if(p&&Array.isArray(p.products)&&(p.savedAt||0)>(SEED.savedAt||0)) return p;}
  }catch(e){}
  return clone(SEED);
}
var S=load();
S.settings=Object.assign({},DEFAULTS,S.settings||{});
var ui={q:'',cat:'Todos',sort:'orig',edit:false};
var toastT=0;
var unlocked=false;
try{unlocked=sessionStorage.getItem('cat-unlock')==='1'}catch(e){}
/* La edición solo se ofrece si el enlace termina en #editar, o tras tocar 5 veces el nombre de la tienda. */
function canEdit(){return unlocked||location.hash==='#editar'}
var imgFails=0, failWarned=false;

function persist(){
  S.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));return true}
  catch(e){toast('No se pudo guardar en este navegador. Usa "Descargar" para conservar tus cambios.');return false}
}
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT);
  toastT=setTimeout(function(){t.hidden=true},3200);
}
function lum(hex){
  var h=String(hex).replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c}).join('');
  var n=parseInt(h,16); if(isNaN(n)) return 0;
  var f=function(v){v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4)};
  return 0.2126*f((n>>16)&255)+0.7152*f((n>>8)&255)+0.0722*f(n&255);
}
function money(n){
  n=Number(n)||0;
  return (S.settings.currency||'')+(Number.isInteger(n)?String(n):n.toFixed(2));
}
function catOf(p){return (p.cat&&p.cat.trim())||'Sin categoría'}

function applyTheme(){
  var st=S.settings, r=document.documentElement;
  r.style.setProperty('--accent',st.accent);
  r.style.setProperty('--accent-ink',lum(st.accent)>0.5?'#14201D':'#FFFFFF');
  r.dataset.font=st.font; r.dataset.density=st.density;
  var custom=!!(st.bg||st.surface||st.ink);
  if(custom){
    var bg=st.bg||BASE.bg, sf=st.surface||BASE.surface, ink=st.ink||BASE.ink;
    r.dataset.theme='light';
    r.style.setProperty('--bg',bg); r.style.setProperty('--surface',sf); r.style.setProperty('--ink',ink);
    r.style.setProperty('--muted','color-mix(in srgb,'+ink+' 62%,'+sf+')');
    r.style.setProperty('--line','color-mix(in srgb,'+ink+' 16%,'+sf+')');
    r.style.setProperty('--chip','color-mix(in srgb,'+ink+' 9%,'+sf+')');
    r.style.setProperty('--accent-text',lum(sf)<0.3?'color-mix(in srgb,'+st.accent+' 55%,#fff)':st.accent);
  }else{
    ['--bg','--surface','--ink','--muted','--line','--chip','--accent-text'].forEach(function(k){r.style.removeProperty(k)});
    if(st.theme==='auto') delete r.dataset.theme; else r.dataset.theme=st.theme;
  }
  r.style.setProperty('--logoh',({small:'40px',medium:'64px',large:'96px'})[st.logoSize]||'64px');
  r.dataset.edit=ui.edit?'1':'0';
  document.title=st.brand||'Catálogo';
  var ic=document.querySelector('link[rel="icon"]');
  if(!ic){ic=document.createElement('link');ic.rel='icon';document.head.appendChild(ic)}
  if(st.logo) ic.href=st.logo; else ic.removeAttribute('href');
  function meta(sel,attrs,content){var m=document.head.querySelector(sel);if(!m){m=document.createElement('meta');for(var k in attrs)m.setAttribute(k,attrs[k]);document.head.appendChild(m)}m.setAttribute('content',content)}
  meta('meta[name="description"]',{name:'description'},st.tagline||'');
  meta('meta[property="og:title"]',{property:'og:title'},st.brand||'');
  meta('meta[property="og:description"]',{property:'og:description'},st.tagline||'');
  meta('meta[property="og:type"]',{property:'og:type'},'website');
}

function renderBar(){
  var b=$('#brand'), t=$('#tagline');
  b.textContent=S.settings.brand; t.textContent=S.settings.tagline;
  var lg=$('#logo');
  if(S.settings.logo){lg.src=S.settings.logo;lg.hidden=false}else{lg.hidden=true;lg.removeAttribute('src')}
  b.hidden=!!S.settings.logo&&!S.settings.showName&&!ui.edit;
  t.hidden=!S.settings.tagline&&!ui.edit;
  b.contentEditable=ui.edit?'true':'false'; t.contentEditable=ui.edit?'true':'false';
  $('#btnEdit').innerHTML=ui.edit
    ? 'Salir de edición'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Editar catálogo';
  var tb=$('#toolbar');
  tb.hidden=!ui.edit;
  tb.innerHTML=ui.edit
    ? '<span class="lbl">Modo edición</span><button class="btn" data-do="add" type="button">+ Producto</button><button class="btn" data-do="design" type="button">Diseño y tienda</button><button class="btn" data-do="download" type="button">Descargar</button><button class="btn primary" data-do="done" type="button">Listo</button>'
    : '';
  $('#note').innerHTML=ui.edit
    ? '<p class="note">Toca un producto para editarlo. Toca el nombre de la tienda o el eslogan para cambiarlos. Los cambios se guardan solos en este navegador; usa <strong>Descargar</strong> para llevarte el catálogo actualizado y súbelo de nuevo a donde lo publicas. Tus clientes no ven estas herramientas: solo aparecen si el enlace termina en <strong>#editar</strong>.</p>'
    : '';
}

function pool(){return S.products.filter(function(p){return ui.edit||!p.hidden})}

function renderChips(){
  var list=pool(), counts={}, order=[];
  list.forEach(function(p){var c=catOf(p); if(!(c in counts)){counts[c]=0;order.push(c)} counts[c]++});
  order.sort(function(a,b){return counts[b]-counts[a]});
  if(ui.cat!=='Todos'&&!(ui.cat in counts)) ui.cat='Todos';
  var html='<button class="chip" type="button" data-cat="Todos" aria-pressed="'+(ui.cat==='Todos')+'">Todos<small>'+list.length+'</small></button>';
  order.forEach(function(c){html+='<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+esc(c)+'<small>'+counts[c]+'</small></button>'});
  $('#chips').innerHTML=html;
}

function visible(){
  var list=pool();
  if(ui.cat!=='Todos') list=list.filter(function(p){return catOf(p)===ui.cat});
  if(ui.q){var q=norm(ui.q); list=list.filter(function(p){return norm(p.name+' '+p.desc+' '+p.cat+' '+p.tag).indexOf(q)>-1})}

function fileToDataURL(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var k=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function fileToLogo(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var w=im.naturalWidth||300, h=im.naturalHeight||300;
        var k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/png'));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ---------- Descargas ---------- */
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'catalogo'}
function saveBlob(text,type,name){
  var b=new Blob([text],{type:type}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function buildHtml(){
  var out=clone(S); out.id=SEED.id; out.savedAt=Date.now();
  var doc=document.documentElement.cloneNode(true);
  ['brand','tagline','chips','grid','count','foot','toolbar','modal','toast','note'].forEach(function(id){
    var e=doc.querySelector('#'+id); if(e){e.innerHTML='';e.removeAttribute('contenteditable')}
  });
  ['toolbar','modal','toast'].forEach(function(id){doc.querySelector('#'+id).setAttribute('hidden','')});
  doc.querySelector('#btnEdit').innerHTML='';
  var lgEl=doc.querySelector('#logo'); lgEl.removeAttribute('src'); lgEl.setAttribute('hidden','');
  var icEl=doc.querySelector('link[rel="icon"]'); if(icEl) icEl.remove();
  doc.removeAttribute('style');
  ['data-theme','data-font','data-density','data-edit'].forEach(function(a){doc.removeAttribute(a)});
  doc.querySelector('body').removeAttribute('class');
  doc.querySelector('#seed').textContent=JSON.stringify(out).replace(/</g,'\\u003c');
  return '<!doctype html>\n'+doc.outerHTML;
}
function download(){
  saveBlob(buildHtml(),'text/html',slug(S.settings.brand)+'-catalogo.html');
  toast('Catálogo descargado. Ábrelo en cualquier dispositivo.');
}

    var lgf=t.files&&t.files[0]; if(!lgf) return;
    fileToLogo(lgf,480).then(function(d){
      S.settings.logo=d; S.settings.showName=S.settings.showName!==false;
      if(!persist()) return;
      applyTheme(); renderBar();
      var lp=$('#logo-prev'); if(lp) lp.innerHTML='<img src="'+d+'" alt="">';
      toast('Logo agregado');
    }).catch(function(){toast('No se pudo leer ese logo. Prueba con un PNG o JPG.')});
    t.value='';
  }
  if(t.id==='imp'){
    var f=t.files&&t.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.products)) throw 0;
        S.products=d.products.map(function(p,i){return {id:String(p.id||('i'+i)),name:String(p.name||''),desc:String(p.desc||''),price:Number(p.price)||0,img:String(p.img||''),cat:String(p.cat||''),hidden:!!p.hidden,tag:String(p.tag||'')}});
        if(d.settings) S.settings=Object.assign({},DEFAULTS,d.settings);
        persist(); closeModal(); renderAll(); toast('Datos importados');
      }catch(err){toast('Ese archivo no es un catálogo válido.')}
    };
    fr.readAsText(f);
  }
});

renderAll();
})();
</script>
</body>
</html>
